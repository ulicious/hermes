transport_mean_line_styles:
   Road: 'dashed'
   Shipping: 'dotted'
   Pipeline: '-'
   Pipeline_Gas: '-'
   New_Pipeline_Gas: '-'
   Pipeline_Liquid: '-'
   New_Pipeline_Liquid: '-'
   None: '/'

# Plot order for route layers. Commodities listed first are plotted first; commodities not listed fall back to the end.
plot_order_road: [Methane_Liquid, DBT, MCH, FTF, Hydrogen_Liquid, Methanol, Ammonia, Hydrogen_Gas]
plot_order_shipping: [Methane_Liquid, DBT, MCH, FTF, Hydrogen_Liquid, Ammonia, Methanol]
plot_order_pipeline: [FTF, Methane_Gas, Hydrogen_Gas]

# Shipping route style. When several commodities share the same route section, dotted dashes are offset by commodity order.
shipping_line_width_base: 0.5  # Line width for all plotted shipping route sections.
shipping_overlap_dash_visible: 1  # Length of the visible part of each shipping dash.
shipping_overlap_dash_offsets: [0, 2, 4, 6, 8]  # Dash offsets for the 1st, 2nd, 3rd, ... overlapping shipping commodity.

line_widths:
   Hydrogen_Gas:
      Road: 0.5
      Pipeline_Gas: 0.5
      New_Pipeline_Gas: 0.5
   Hydrogen_Liquid:
      Road: 1
      Shipping: 1.5
   Ammonia:
      Road: 0.5
      Shipping: 1
   Methane_Gas:
      Pipeline_Gas: 1
      New_Pipeline_Gas: 1
   Methane_Liquid:
      Road: 0.5
      Shipping: 0.5
   Methanol:
      Road: 0.5
      Shipping: 0.75
   DBT:
      Road: 0.5
      Shipping: 1.5
   MCH:
      Road: 0.5
      Shipping: 1.5
   FTF:
      Road: 0.5
      Shipping: 1
      Pipeline_Liquid: 1
      New_Pipeline_Liquid: 1
